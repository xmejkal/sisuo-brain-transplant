<!doctype html>
<!-- The bin's board viewer TEMPLATE. tools/build-viewer.py fills every @@NAME@@ from the current
     exports and `make all` writes board-viewer.html; nothing here is a fact about the board. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Bin Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root {
    --bg:#F3EFE7; --surface:#FFFFFF; --stage:#EAE4D8; --ink:#241F1A; --muted:#6D6459;
    --line:#DFD6C6; --line-strong:#C8BCA6; --accent:#B26A2E; --good:#4B7F52; --warn:#B4832B;
    --shadow:0 1px 2px rgba(40,30,18,.06),0 8px 24px rgba(40,30,18,.08);
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:"Archivo",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    --dark:#0C0A06;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --bg:#151109; --surface:#1F1A12; --stage:#0F0C07; --ink:#EFE7DA; --muted:#9C9184;
    --line:#332B1F; --line-strong:#4A3F2D; --accent:#E0A458; --good:#7FB587; --warn:#D6A64A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.5);
  } }
  :root[data-theme="dark"]{
    --bg:#151109; --surface:#1F1A12; --stage:#0F0C07; --ink:#EFE7DA; --muted:#9C9184;
    --line:#332B1F; --line-strong:#4A3F2D; --accent:#E0A458; --good:#7FB587; --warn:#D6A64A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.5);
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); }
  .app { height:100%; display:flex; flex-direction:column; padding:0 16px; padding-block:14px;
    max-width:1100px; margin:0 auto; gap:12px; }
  header { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .brand { display:flex; flex-direction:column; gap:2px; }
  .eyebrow { font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--accent); font-weight:500; }
  h1 { margin:0; font-size:clamp(20px,3.4vw,26px); font-weight:700; letter-spacing:-.01em; text-wrap:balance; }
  .dims { font-family:var(--mono); font-size:12px; color:var(--muted); }
  .tabs { display:inline-flex; background:var(--surface); border:1px solid var(--line);
    border-radius:11px; padding:4px; gap:2px; box-shadow:var(--shadow); }
  .tab { appearance:none; border:0; background:transparent; color:var(--muted); cursor:pointer;
    font-family:var(--sans); font-weight:600; font-size:13.5px; padding:8px 16px; border-radius:8px;
    display:flex; align-items:center; gap:7px; transition:color .12s,background .12s; }
  .tab:hover { color:var(--ink); }
  .tab[aria-selected="true"] { background:var(--accent); color:#fff; }
  .tab .dot { width:8px; height:8px; border-radius:50%; background:currentColor; opacity:.5; }
  .tab[aria-selected="true"] .dot { opacity:1; }
  .frame { flex:1; min-height:0; position:relative; background:var(--stage);
    border:1px solid var(--line-strong); border-radius:14px; overflow:hidden; box-shadow:var(--shadow); }
  .panel { position:absolute; inset:0; }
  .panel[hidden] { display:none!important; }
  #p-pcb, #p-3d { background:var(--dark); }
  .stg { position:absolute; inset:0; overflow:hidden; touch-action:none; cursor:grab; }
  .stg.grabbing { cursor:grabbing; }
  .pz { position:absolute; inset:0; transform-origin:0 0; will-change:transform; }
  .pz svg { width:100%; height:100%; display:block; }
  #p-3d canvas { position:absolute; inset:0; width:100%; height:100%; display:block; cursor:grab; }
  #p-3d .loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:var(--mono); font-size:12px; color:#C9BEA8; }
  .zoombar { position:absolute; right:12px; bottom:12px; display:flex; gap:6px; z-index:5; }
  .zoombar button { width:34px; height:34px; border-radius:9px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); font-family:var(--mono); font-size:16px; cursor:pointer;
    box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center; padding:0; }
  .zoombar button:hover { border-color:var(--accent); color:var(--accent); }
  .hint { position:absolute; left:12px; bottom:12px; z-index:5; font-family:var(--mono); font-size:11px;
    color:var(--muted); background:color-mix(in srgb,var(--surface) 82%,transparent); padding:5px 9px;
    border-radius:7px; border:1px solid var(--line); }
  #p-pcb .hint, #p-3d .hint { color:#C9BEA8; background:rgba(12,10,6,.6); border-color:rgba(255,255,255,.12); }
  footer { display:flex; flex-wrap:wrap; align-items:center; gap:10px 20px; }
  .spec { display:flex; align-items:baseline; gap:7px; font-family:var(--mono); font-size:12px; }
  .spec .k { color:var(--muted); text-transform:uppercase; letter-spacing:.08em; font-size:10.5px; }
  .pill { font-family:var(--mono); font-size:11px; padding:3px 9px; border-radius:999px;
    border:1px solid var(--line); display:inline-flex; align-items:center; gap:6px; }
  .pill.ok { color:var(--good); } .pill.pending { color:var(--warn); }
  .pill::before { content:""; width:7px; height:7px; border-radius:50%; background:currentColor; }
  .nets b { color:var(--accent); }
  @media (max-width:520px){ .dims{display:none;} .hint{display:none;} }
</style>
<script type="importmap">@@IMPORTMAP@@</script>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span class="eyebrow">tscircuit · exported views · made by make</span><h1>Smart Bin Board</h1></div>
    <div class="dims">@@DIMS@@</div>
  </header>
  <div class="tabs" role="tablist" aria-label="View mode">
    <button class="tab" role="tab" aria-selected="true"  data-panel="p-sch"><span class="dot"></span>Schematic</button>
    <button class="tab" role="tab" aria-selected="false" data-panel="p-pcb"><span class="dot"></span>PCB</button>
    <button class="tab" role="tab" aria-selected="false" data-panel="p-3d"><span class="dot"></span>3D</button>
  </div>
  <div class="frame">
    <div class="panel" id="p-sch"><div class="stg" data-pz><div class="pz">@@SCHEMATIC@@</div></div>
      <div class="hint">scroll to zoom · drag to pan</div>
      <div class="zoombar"><button data-z="out" aria-label="Zoom out">&minus;</button><button data-z="reset" aria-label="Reset">&#8634;</button><button data-z="in" aria-label="Zoom in">+</button></div></div>
    <div class="panel" id="p-pcb" hidden><div class="stg" data-pz><div class="pz">@@PCB@@</div></div>
      <div class="hint">scroll to zoom · drag to pan</div>
      <div class="zoombar"><button data-z="out" aria-label="Zoom out">&minus;</button><button data-z="reset" aria-label="Reset">&#8634;</button><button data-z="in" aria-label="Zoom in">+</button></div></div>
    <div class="panel" id="p-3d" hidden>
      <div class="loading">loading the 3D model…</div>
      <div class="hint">drag to orbit · scroll to zoom</div>
    </div>
  </div>
  <footer>@@FOOTER@@</footer>
</div>

<script id="model" type="application/octet-stream">@@MODEL@@</script>
<script>
(function(){
  // ---------- tabs ----------
  var tabs=[].slice.call(document.querySelectorAll('.tab')), started=false;
  tabs.forEach(function(t){ t.addEventListener('click',function(){
    tabs.forEach(function(o){ var on=o===t; o.setAttribute('aria-selected',on?'true':'false');
      document.getElementById(o.dataset.panel).hidden=!on; });
    if(t.dataset.panel==='p-3d' && !started){ started=true; import('board-3d').then(function(m){ m.show(); }); }
  }); });

  // ---------- pan/zoom for SVG stages ----------
  document.querySelectorAll('[data-pz]').forEach(function(stage){
    var c=stage.querySelector('.pz'), s=1,tx=0,ty=0,drag=false,sx=0,sy=0,MIN=.4,MAX=12;
    function ap(){ c.style.transform='translate('+tx+'px,'+ty+'px) scale('+s+')'; }
    function reset(){ s=1;tx=0;ty=0;ap(); }
    function zoom(cx,cy,f){ var ns=Math.min(MAX,Math.max(MIN,s*f)),k=ns/s; tx=cx-k*(cx-tx); ty=cy-k*(cy-ty); s=ns; ap(); }
    stage.addEventListener('wheel',function(e){ e.preventDefault(); var r=stage.getBoundingClientRect();
      zoom(e.clientX-r.left,e.clientY-r.top,e.deltaY<0?1.12:1/1.12); },{passive:false});
    stage.addEventListener('pointerdown',function(e){ drag=true;sx=e.clientX-tx;sy=e.clientY-ty;
      stage.classList.add('grabbing'); stage.setPointerCapture(e.pointerId); });
    stage.addEventListener('pointermove',function(e){ if(drag){tx=e.clientX-sx;ty=e.clientY-sy;ap();} });
    function end(){ drag=false; stage.classList.remove('grabbing'); }
    stage.addEventListener('pointerup',end); stage.addEventListener('pointercancel',end);
    var bar=stage.parentElement.querySelector('.zoombar');
    if(bar) bar.addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b) return;
      var r=stage.getBoundingClientRect(); if(b.dataset.z==='in')zoom(r.width/2,r.height/2,1.3);
      else if(b.dataset.z==='out')zoom(r.width/2,r.height/2,1/1.3); else reset(); });
  });
})();
</script>
</body>
</html>
