# Every push: does everything still describe the same bin?
#
# This is `make check` — it changes nothing and fails if the firmware, the board and the
# simulation have drifted apart. The one thing CI can do that a person cannot is never forget.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install the toolchains
        run: |
          npm ci
          pip install mpy-cross littlefs-python
          cd tools/circuit-to-wokwi && bun install

      # The MicroPython unix build is not packaged for CI runners; `make check` skips that step
      # when it is absent and says so, rather than pretending it passed.
      #
      # So does the spark plugin: it is a private repository and NO token to reach it is kept here
      # or anywhere on GitHub (backlog B7). Without it the four checks that run spark's own
      # scripts are skipped by name and raised as warnings on this run; everything else runs.
      # When spark is public, check it out beside this repo and they run too — still no token.
      - name: Check that everything is in step
        run: make check
